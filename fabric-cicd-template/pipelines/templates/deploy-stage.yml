# =============================================================================
#  Deploy stage - one per environment, called by cd-pipeline.yml
# =============================================================================
#    Gate         OPTIONAL approval job (agentless ManualValidation). Named approvers get an
#                 email; the run waits; reject or timeout = stage fails (can be re-run later).
#    Deploy       preflight -> plan -> fabric-cicd publish -> optional clean-up -> smoke check
#                 Each phase is a section in the log; fabric-cicd output is a collapsible group.
#    Post-deploy  OPTIONAL: run a pipeline/notebook in the workspace and wait for success
#    Logs         deploy report on the Summary tab + "logs-<ENV>-<attempt>" artefact
#    Tag          OPTIONAL (PROD): tag the released commit release/<run name>
#  No values to change in this file - set them in cd-pipeline.yml.
# =============================================================================

parameters:
  - name: envName                    # DEV | TEST | PROD (must match parameter.yml keys)
    type: string
  - name: adoEnvironment             # Azure DevOps environment (deployment history, exclusive lock)
    type: string
  - name: workspaceId
    type: string
  - name: dependsOn
    type: object
    default: [Build]
  # -- approval gate --
  - name: requireApproval
    type: boolean
    default: false
  - name: approvers                  # comma-separated emails or [Project]\Group
    type: string
    default: ''
  - name: allowSelfApproval
    type: boolean
    default: false
  - name: approvalTimeoutMinutes     # unanswered gate is rejected after this; max 4200 (job limit below)
    type: string
    default: '4200'
  - name: approvalInstructions
    type: string
    default: 'Approve to deploy.'
  # -- post-deploy test --
  - name: postDeployItemName         # '' = skip
    type: string
    default: ''
  - name: postDeployItemType         # DataPipeline | Notebook
    type: string
    default: DataPipeline
  - name: postDeployTimeoutMinutes   # keep below 330 (Microsoft-hosted job limit 360)
    type: string
    default: '60'
  # -- misc --
  - name: removeDeletedItems
    type: boolean
    default: false
  - name: debugLogging
    type: boolean
    default: false
  - name: tagRelease
    type: boolean
    default: false
  - name: fabricFolder
    type: string
    default: workspace
  - name: artifactName
    type: string
    default: fabric-items
  - name: agentImage
    type: string
    default: ubuntu-latest
  - name: pythonVersion
    type: string
    default: '3.11'

stages:
  - stage: Deploy_${{ parameters.envName }}
    displayName: ${{ parameters.envName }}
    dependsOn: ${{ parameters.dependsOn }}
    condition: succeeded()
    jobs:
      # ------------------------------------------------------------ approval gate
      - ${{ if eq(parameters.requireApproval, true) }}:
        - job: Approval
          displayName: Approve ${{ parameters.envName }}
          pool: server                    # agentless: uses no agent while waiting
          timeoutInMinutes: 4320          # 3 days; must exceed approvalTimeoutMinutes
          steps:
            - task: ManualValidation@1
              displayName: Waiting for approval
              timeoutInMinutes: ${{ parameters.approvalTimeoutMinutes }}
              inputs:
                notifyUsers: ${{ parameters.approvers }}
                approvers: ${{ parameters.approvers }}
                allowApproversToApproveTheirOwnRuns: ${{ parameters.allowSelfApproval }}
                instructions: ${{ parameters.approvalInstructions }}
                onTimeout: reject

      # ------------------------------------------------------------ deploy
      - deployment: Deploy
        displayName: Deploy to ${{ parameters.envName }}
        ${{ if eq(parameters.requireApproval, true) }}:
          dependsOn: Approval
        environment: ${{ parameters.adoEnvironment }}
        timeoutInMinutes: 0      # agent maximum (360 min on Microsoft-hosted) - room for the post-deploy test
        pool:
          vmImage: ${{ parameters.agentImage }}
        strategy:
          runOnce:
            deploy:
              steps:
                - download: current
                  artifact: ${{ parameters.artifactName }}
                  displayName: Download artefact

                - task: UsePythonVersion@0
                  displayName: Use Python ${{ parameters.pythonVersion }}
                  inputs:
                    versionSpec: ${{ parameters.pythonVersion }}

                - script: |
                    python -m pip install --upgrade pip --quiet --disable-pip-version-check
                    pip install -r "$(Pipeline.Workspace)/${{ parameters.artifactName }}/requirements.txt" --disable-pip-version-check
                    mkdir -p "$(Pipeline.Workspace)/logs"
                  displayName: Install dependencies

                - script: |
                    set -o pipefail
                    cd "$(Pipeline.Workspace)/logs"      # fabric-cicd writes its error log here
                    echo "Run:         $(Build.BuildNumber)"
                    echo "Commit:      $(Build.SourceVersion)"
                    echo "Environment: ${{ parameters.envName }}"
                    echo "Workspace:   ${{ parameters.workspaceId }}"
                    python "$(Pipeline.Workspace)/${{ parameters.artifactName }}/scripts/deploy.py" \
                      --workspace-id "${{ parameters.workspaceId }}" \
                      --environment ${{ parameters.envName }} \
                      --repo-dir "$(Pipeline.Workspace)/${{ parameters.artifactName }}/${{ parameters.fabricFolder }}" \
                      --remove-deleted-items ${{ parameters.removeDeletedItems }} \
                      --debug ${{ parameters.debugLogging }} \
                      --summary-file "$(Pipeline.Workspace)/logs/deploy-${{ parameters.envName }}.md" \
                      2>&1 | tee "$(Pipeline.Workspace)/logs/deploy-${{ parameters.envName }}.log"
                  displayName: Deploy to ${{ parameters.envName }} (preflight, publish, smoke check)
                  env:   # secrets must be mapped explicitly
                    AZURE_TENANT_ID: $(AZURE_TENANT_ID)
                    AZURE_CLIENT_ID: $(AZURE_CLIENT_ID)
                    AZURE_CLIENT_SECRET: $(AZURE_CLIENT_SECRET)
                    PYTHONUNBUFFERED: '1'

                - ${{ if ne(parameters.postDeployItemName, '') }}:
                  - script: |
                      set -o pipefail
                      python "$(Pipeline.Workspace)/${{ parameters.artifactName }}/scripts/run_item.py" \
                        --workspace-id "${{ parameters.workspaceId }}" \
                        --item-name "${{ parameters.postDeployItemName }}" \
                        --item-type ${{ parameters.postDeployItemType }} \
                        --timeout-minutes ${{ parameters.postDeployTimeoutMinutes }} \
                        --environment ${{ parameters.envName }} \
                        --summary-file "$(Pipeline.Workspace)/logs/post-deploy-${{ parameters.envName }}.md" \
                        2>&1 | tee "$(Pipeline.Workspace)/logs/post-deploy-${{ parameters.envName }}.log"
                    displayName: Post-deploy test - run ${{ parameters.postDeployItemName }}
                    env:
                      AZURE_TENANT_ID: $(AZURE_TENANT_ID)
                      AZURE_CLIENT_ID: $(AZURE_CLIENT_ID)
                      AZURE_CLIENT_SECRET: $(AZURE_CLIENT_SECRET)
                      PYTHONUNBUFFERED: '1'

                - publish: $(Pipeline.Workspace)/logs
                  artifact: logs-${{ parameters.envName }}-$(System.JobAttempt)
                  displayName: Publish deployment logs
                  condition: succeededOrFailed()
                  continueOnError: true

                - ${{ if eq(parameters.tagRelease, true) }}:
                  # Needs "<Project> Build Service" to have Contribute + Create tag on the repo.
                  - checkout: self
                    persistCredentials: true
                    fetchDepth: 0
                  - script: |
                      set -e
                      TAG="release/$(Build.BuildNumber)"
                      if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
                        echo "Tag $TAG already exists (stage re-run) - nothing to do."; exit 0
                      fi
                      git config user.email "$(Build.RequestedForEmail)"
                      git config user.name "$(Build.RequestedFor)"
                      git tag -a "$TAG" "$(Build.SourceVersion)" -m "${{ parameters.envName }} release $(Build.BuildNumber)"
                      git push origin "$TAG"
                      echo "##vso[build.addbuildtag]released"
                      echo "Tagged $(Build.SourceVersion) as $TAG"
                    workingDirectory: $(Build.SourcesDirectory)
                    displayName: Tag the released commit
