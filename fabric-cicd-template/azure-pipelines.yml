# =============================================================================
#  Microsoft Fabric CI/CD - Azure DevOps pipeline TEMPLATE (single file)
# =============================================================================
#
#  WHAT IT DOES
#    feature/*  --PR-->  develop  ==> DEV workspace   (automatic on merge)
#    develop    --PR-->  main     ==> TEST workspace  (automatic on merge)
#                                 ==> PROD workspace  (after approval) ==> git tag
#    hotfix/*   --PR-->  main     ==> TEST ==> PROD, then merge main back into develop
#
#    Pull requests into develop or main run the Build stage only (validation, no deploy),
#    when this pipeline is added as a Build Validation branch policy.
#
#  HOW TO USE THIS TEMPLATE
#    1. Search this file for ">>> CHANGE" and set every value marked.
#    2. Copy workspace/parameter.yml into your repo's Fabric folder and fill it in.
#    3. Create in Azure DevOps:
#         - a variable group holding AZURE_TENANT_ID, AZURE_CLIENT_ID, AZURE_CLIENT_SECRET
#         - three Environments (names below); add an Approvals check on the PROD one
#    4. New pipeline -> Azure Repos Git -> Existing YAML -> this file -> Validate -> Save.
#    Full checklist: README.md
#
#  HOW IT WORKS
#    The Build stage writes two small Python helpers (validate.py, deploy.py) to disk,
#    validates the Fabric items, and publishes them as one artefact. Each Deploy stage
#    runs deploy.py, which uses Microsoft's fabric-cicd library to publish the items
#    into the target workspace and then checks every item arrived.
# =============================================================================

# Run name shown in Azure DevOps, e.g. my-fabric-project_2026.01.31.1
# The same value becomes the release tag after a PROD deployment.
name: $(projectSlug)_$(Date:yyyy.MM.dd)$(Rev:.r)

# -----------------------------------------------------------------------------
# Triggers
# >>> CHANGE (optional): if your branches are not called develop / main, rename them
#     here AND in the stage conditions further down (search "refs/heads/").
# -----------------------------------------------------------------------------
trigger:
  branches:
    include:
      - develop
      - main
  paths:
    exclude:
      - README.md

pr: none   # Azure Repos ignores this; PR runs come from the branch policy.

# -----------------------------------------------------------------------------
# Options shown when someone clicks "Run pipeline"
# -----------------------------------------------------------------------------
parameters:
  - name: removeDeletedItems
    displayName: Remove items from the target that were deleted from the repo (Notebooks/Pipelines only - lakehouses are never deleted)
    type: boolean
    default: false
  - name: debugLogging
    displayName: Verbose fabric-cicd logging
    type: boolean
    default: false

# =============================================================================
#  CONFIGURE ME - everything project-specific lives in this block
# =============================================================================
variables:
  # >>> CHANGE: name of the Azure DevOps variable group (Pipelines -> Library) that holds
  #     AZURE_TENANT_ID, AZURE_CLIENT_ID and AZURE_CLIENT_SECRET (mark the secret as secret)
  #     for a service principal that is Contributor on all three workspaces.
  - group: vargrp-fabric-deploy

  # >>> CHANGE: short project name, lower case, no spaces. Used for the run name, the
  #     release tag and the Azure DevOps environment names (<slug>-dev / -test / -prod).
  - name: projectSlug
    value: my-fabric-project

  # >>> CHANGE: Fabric workspace IDs. Open the workspace in Fabric; the ID is the GUID in
  #     the browser address after /groups/.  Deployment stops with a clear error while
  #     these still contain <...>.
  - name: devWorkspaceId
    value: <DEV_WORKSPACE_ID>
  - name: testWorkspaceId
    value: <TEST_WORKSPACE_ID>
  - name: prodWorkspaceId
    value: <PROD_WORKSPACE_ID>

  # >>> CHANGE (optional): repo folder that Fabric Git integration syncs to
  #     (Workspace settings -> Git integration -> "Git folder"). parameter.yml lives here.
  - name: fabricFolder
    value: workspace

  # >>> CHANGE (optional): Microsoft-hosted agent image. For a self-hosted pool, replace
  #     every "vmImage: $(agentImage)" line below with "name: <your-pool-name>".
  #     Agents need Python and outbound HTTPS to api.fabric.microsoft.com,
  #     api.powerbi.com and login.microsoftonline.com.
  - name: agentImage
    value: ubuntu-latest

  # Tool versions. Pinned on purpose - read the fabric-cicd changelog before bumping.
  - name: pythonVersion
    value: '3.11'
  - name: fabricCicdVersion
    value: '1.2.0'

  # Fixed - no need to change.
  - name: artifactName
    value: fabric-items

# =============================================================================
#  STAGES - nothing below needs editing unless you rename branches or add stages
# =============================================================================
stages:

# ----------------------------------------------------------------------------- BUILD
# Runs on every trigger and every PR: writes the helpers, validates, packages.
- stage: Build
  displayName: Validate and package
  jobs:
  - job: Validate
    pool:
      vmImage: $(agentImage)
    steps:
    - checkout: self

    - task: UsePythonVersion@0
      inputs:
        versionSpec: $(pythonVersion)

    - script: pip install "fabric-cicd==$(fabricCicdVersion)" "azure-identity>=1.15" "pyyaml>=6.0" "requests>=2.31"
      displayName: Install dependencies

    # The two helper scripts are embedded here so the whole pipeline is one YAML file.
    # Edit them in place if needed (e.g. ITEM_TYPES in deploy.py).
    - script: |
        mkdir -p "$(Build.ArtifactStagingDirectory)/scripts"
        cat > "$(Build.ArtifactStagingDirectory)/scripts/validate.py" <<'PY'
        """Pre-deployment checks. Fails the Build stage before anything is deployed.

        Checks:
          1. Every item folder has a valid .platform file.
          2. parameter.yml exists, parses, and has DEV, TEST and PROD values for every rule.
          3. No <PLACEHOLDER> values are left in parameter.yml.
          4. Warns about GUIDs in notebook/pipeline code that parameter.yml does not map
             (these would still point at Dev after deployment).
        """
        import argparse
        import json
        import re
        import sys
        from pathlib import Path

        import yaml

        GUID = re.compile(r"[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}")
        ZERO_GUID = "00000000-0000-0000-0000-000000000000"
        ENVIRONMENTS = ("DEV", "TEST", "PROD")
        CONTENT_FILES = ("notebook-content.py", "notebook-content.ipynb", "pipeline-content.json")

        errors: list[str] = []
        warnings: list[str] = []


        def check_items(repo: Path) -> set[str]:
            logical_ids = set()
            # Item folders are named "<name>.<Type>"; Fabric workspace folders become plain subfolders.
            item_suffix = re.compile(r"\.(Lakehouse|Notebook|DataPipeline|SemanticModel|Report|Warehouse|Environment|VariableLibrary)$")
            folders = [d for d in repo.rglob("*") if d.is_dir() and item_suffix.search(d.name)]
            if not folders:
                errors.append(f"No Fabric item folders found in {repo}. Is the Git folder set correctly?")
            for folder in folders:
                platform = folder / ".platform"
                if not platform.exists():
                    errors.append(f"{folder.relative_to(repo)}: missing .platform")
                    continue
                try:
                    data = json.loads(platform.read_text(encoding="utf-8"))
                    logical_ids.add(data["config"]["logicalId"].lower())
                    name = data["metadata"]["displayName"]
                    if "/" in name or "\\" in name:
                        errors.append(f"{folder.name}: display name '{name}' contains a slash; rename the item")
                except (json.JSONDecodeError, KeyError) as exc:
                    errors.append(f"{folder.name}: invalid .platform ({exc})")
            return logical_ids


        def check_parameters(repo: Path) -> tuple[set[str], list[re.Pattern]]:
            mapped: set[str] = set()
            patterns: list[re.Pattern] = []
            param_file = repo / "parameter.yml"
            if not param_file.exists():
                errors.append("parameter.yml not found in the workspace folder")
                return mapped, patterns
            text = param_file.read_text(encoding="utf-8")
            active = "\n".join(line.split("#", 1)[0] for line in text.splitlines())
            for placeholder in sorted(set(re.findall(r"<[A-Z_]+>", active))):
                errors.append(f"parameter.yml still contains placeholder {placeholder}")
            try:
                params = yaml.safe_load(text) or {}
            except yaml.YAMLError as exc:
                errors.append(f"parameter.yml is not valid YAML: {exc}")
                return mapped, patterns
            for section in ("find_replace", "key_value_replace"):
                for i, rule in enumerate(params.get(section) or []):
                    values = rule.get("replace_value", {})
                    for env in ENVIRONMENTS:
                        if env not in values:
                            errors.append(f"parameter.yml {section}[{i}]: no {env} value")
                    find = str(rule.get("find_value", ""))
                    if str(rule.get("is_regex", "")).lower() == "true":
                        try:
                            patterns.append(re.compile(find))
                        except re.error as exc:
                            errors.append(f"parameter.yml {section}[{i}]: invalid regex ({exc})")
                    else:
                        mapped.update(g.lower() for g in GUID.findall(find))
            return mapped, patterns


        def check_unmapped_guids(repo: Path, logical_ids: set[str], mapped: set[str], patterns: list[re.Pattern]) -> None:
            for path in repo.rglob("*"):
                if path.name not in CONTENT_FILES:
                    continue
                text = path.read_text(encoding="utf-8")
                for pattern in patterns:
                    text = pattern.sub("", text)
                for guid in set(g.lower() for g in GUID.findall(text)):
                    if guid != ZERO_GUID and guid not in logical_ids and guid not in mapped:
                        warnings.append(f"{path.relative_to(repo)}: GUID {guid} is not mapped in parameter.yml")


        def main() -> None:
            p = argparse.ArgumentParser()
            p.add_argument("--repo-dir", required=True)
            repo = Path(p.parse_args().repo_dir)
            if not repo.is_dir():
                sys.exit(f"{repo} does not exist")

            logical_ids = check_items(repo)
            mapped, patterns = check_parameters(repo)
            check_unmapped_guids(repo, logical_ids, mapped, patterns)

            for w in warnings:
                print(f"##vso[task.logissue type=warning]{w}")
            for e in errors:
                print(f"##vso[task.logissue type=error]{e}")
            print(f"Validation: {len(errors)} error(s), {len(warnings)} warning(s).")
            sys.exit(1 if errors else 0)


        if __name__ == "__main__":
            main()
        PY
        cat > "$(Build.ArtifactStagingDirectory)/scripts/deploy.py" <<'PY'
        """Deploy the Fabric items in the repo to one target workspace, then smoke-check.

        Written to disk by the Build stage of azure-pipelines.yml and run by each Deploy stage.
        Can also be run locally:
          python deploy.py --workspace-id <guid> --environment TEST --repo-dir workspace
        (set AZURE_TENANT_ID / AZURE_CLIENT_ID / AZURE_CLIENT_SECRET first)
        """
        import argparse
        import json
        import os
        import re
        import sys
        from pathlib import Path

        import requests
        from azure.identity import ClientSecretCredential
        from fabric_cicd import (
            FabricWorkspace,
            change_log_level,
            publish_all_items,
            unpublish_all_orphan_items,
        )

        # >>> CHANGE: item types your workspace contains. fabric-cicd publishes them in
        # dependency order (Lakehouse first), so notebooks can be re-pointed to the new
        # lakehouse ID. Other supported types include "Environment", "SemanticModel",
        # "Report", "Warehouse", "VariableLibrary". The SQL analytics endpoint is created
        # automatically with its lakehouse and must NOT be listed.
        ITEM_TYPES = ["Lakehouse", "Notebook", "DataPipeline"]

        # >>> CHANGE (optional): items whose names match this are never deployed.
        # Default: sandbox copies named with a "_dev" suffix.
        EXCLUDE_REGEX = r".*_dev$"

        FABRIC_API = "https://api.fabric.microsoft.com/v1"


        def as_bool(value: str) -> bool:
            return str(value).strip().lower() in ("true", "1", "yes")


        def get_credential() -> ClientSecretCredential:
            missing = [v for v in ("AZURE_TENANT_ID", "AZURE_CLIENT_ID", "AZURE_CLIENT_SECRET") if not os.environ.get(v)]
            if missing:
                sys.exit(f"Missing environment variables: {', '.join(missing)}")
            return ClientSecretCredential(
                tenant_id=os.environ["AZURE_TENANT_ID"],
                client_id=os.environ["AZURE_CLIENT_ID"],
                client_secret=os.environ["AZURE_CLIENT_SECRET"],
            )


        def repo_items(repo_dir: Path) -> set[tuple[str, str]]:
            """(type, displayName) for every in-scope item folder in the repo."""
            items = set()
            for platform in repo_dir.rglob(".platform"):
                meta = json.loads(platform.read_text(encoding="utf-8"))["metadata"]
                if meta["type"] in ITEM_TYPES and not meta["displayName"].endswith("_dev"):
                    items.add((meta["type"], meta["displayName"]))
            return items


        def workspace_items(workspace_id: str, credential) -> set[tuple[str, str]]:
            token = credential.get_token("https://api.fabric.microsoft.com/.default").token
            headers = {"Authorization": f"Bearer {token}"}
            url = f"{FABRIC_API}/workspaces/{workspace_id}/items"
            found = set()
            while url:
                resp = requests.get(url, headers=headers, timeout=60)
                resp.raise_for_status()
                body = resp.json()
                found.update((i["type"], i["displayName"]) for i in body.get("value", []))
                url = body.get("continuationUri")
            return found


        def smoke_check(repo_dir: Path, workspace_id: str, credential) -> None:
            expected = repo_items(repo_dir)
            actual = workspace_items(workspace_id, credential)
            missing = sorted(expected - actual)
            print(f"Smoke check: {len(expected)} items expected, {len(expected) - len(missing)} found.")
            if missing:
                for item_type, name in missing:
                    print(f"##vso[task.logissue type=error]Missing after deploy: {item_type} '{name}'")
                sys.exit(1)


        def main() -> None:
            p = argparse.ArgumentParser()
            p.add_argument("--workspace-id", required=True)
            p.add_argument("--environment", required=True, choices=["DEV", "TEST", "PROD"])
            p.add_argument("--repo-dir", required=True)
            p.add_argument("--remove-deleted-items", default="false")
            p.add_argument("--debug", default="false")
            args = p.parse_args()

            if as_bool(args.debug):
                change_log_level("DEBUG")

            if not re.fullmatch(r"[0-9a-fA-F]{8}(-[0-9a-fA-F]{4}){3}-[0-9a-fA-F]{12}", args.workspace_id):
                sys.exit(f"--workspace-id '{args.workspace_id}' is not a GUID. Set the workspace ID variables in azure-pipelines.yml.")

            repo_dir = Path(args.repo_dir).resolve()
            credential = get_credential()

            print(f"Deploying {repo_dir} -> {args.environment} ({args.workspace_id})")
            workspace = FabricWorkspace(
                workspace_id=args.workspace_id,
                environment=args.environment,
                repository_directory=str(repo_dir),
                item_type_in_scope=ITEM_TYPES,
                token_credential=credential,
            )

            publish_all_items(workspace, item_name_exclude_regex=EXCLUDE_REGEX)

            if as_bool(args.remove_deleted_items):
                # Lakehouses are never unpublished by fabric-cicd unless a feature flag is set,
                # so tables/data in the target are safe.
                unpublish_all_orphan_items(workspace)

            smoke_check(repo_dir, args.workspace_id, credential)
            print("Deployment complete.")


        if __name__ == "__main__":
            main()
        PY
      displayName: Write helper scripts

    - script: python "$(Build.ArtifactStagingDirectory)/scripts/validate.py" --repo-dir "$(fabricFolder)"
      displayName: Validate Fabric items and parameter.yml

    - task: CopyFiles@2
      displayName: Stage Fabric items
      condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'))
      inputs:
        SourceFolder: $(Build.SourcesDirectory)
        Contents: $(fabricFolder)/**
        TargetFolder: $(Build.ArtifactStagingDirectory)

    - publish: $(Build.ArtifactStagingDirectory)
      artifact: $(artifactName)
      displayName: Publish artefact
      condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'))

# ----------------------------------------------------------------------------- DEV
# Runs after a merge into develop.
- stage: Deploy_DEV
  displayName: Deploy to DEV
  dependsOn: Build
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/develop'), ne(variables['Build.Reason'], 'PullRequest'))
  jobs:
  - deployment: Publish
    displayName: Publish Fabric items to DEV
    # Azure DevOps environment. Add an "Exclusive lock" check so two merges can't deploy at once.
    environment: ${{ variables.projectSlug }}-dev
    pool:
      vmImage: $(agentImage)
    strategy:
      runOnce:
        deploy:
          steps:
          - download: current
            artifact: $(artifactName)

          - task: UsePythonVersion@0
            inputs:
              versionSpec: $(pythonVersion)

          - script: pip install "fabric-cicd==$(fabricCicdVersion)" "azure-identity>=1.15" "pyyaml>=6.0" "requests>=2.31"
            displayName: Install dependencies

          - script: >
              python "$(Pipeline.Workspace)/$(artifactName)/scripts/deploy.py"
              --workspace-id "$(devWorkspaceId)"
              --environment DEV
              --repo-dir "$(Pipeline.Workspace)/$(artifactName)/$(fabricFolder)"
              --remove-deleted-items ${{ parameters.removeDeletedItems }}
              --debug ${{ parameters.debugLogging }}
            displayName: Deploy + smoke check
            env:   # secrets must be mapped explicitly
              AZURE_TENANT_ID: $(AZURE_TENANT_ID)
              AZURE_CLIENT_ID: $(AZURE_CLIENT_ID)
              AZURE_CLIENT_SECRET: $(AZURE_CLIENT_SECRET)

# ----------------------------------------------------------------------------- TEST
# Runs after a merge into main (a release PR or a hotfix).
- stage: Deploy_TEST
  displayName: Deploy to TEST
  dependsOn: Build
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'), ne(variables['Build.Reason'], 'PullRequest'))
  jobs:
  - deployment: Publish
    displayName: Publish Fabric items to TEST
    environment: ${{ variables.projectSlug }}-test
    pool:
      vmImage: $(agentImage)
    strategy:
      runOnce:
        deploy:
          steps:
          - download: current
            artifact: $(artifactName)

          - task: UsePythonVersion@0
            inputs:
              versionSpec: $(pythonVersion)

          - script: pip install "fabric-cicd==$(fabricCicdVersion)" "azure-identity>=1.15" "pyyaml>=6.0" "requests>=2.31"
            displayName: Install dependencies

          - script: >
              python "$(Pipeline.Workspace)/$(artifactName)/scripts/deploy.py"
              --workspace-id "$(testWorkspaceId)"
              --environment TEST
              --repo-dir "$(Pipeline.Workspace)/$(artifactName)/$(fabricFolder)"
              --remove-deleted-items ${{ parameters.removeDeletedItems }}
              --debug ${{ parameters.debugLogging }}
            displayName: Deploy + smoke check
            env:
              AZURE_TENANT_ID: $(AZURE_TENANT_ID)
              AZURE_CLIENT_ID: $(AZURE_CLIENT_ID)
              AZURE_CLIENT_SECRET: $(AZURE_CLIENT_SECRET)

# ----------------------------------------------------------------------------- PROD
# Waits for the Approvals check on the <slug>-prod environment, deploys the SAME
# artefact that went to TEST, then tags the commit.
- stage: Deploy_PROD
  displayName: Deploy to PROD
  dependsOn: Deploy_TEST
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'), ne(variables['Build.Reason'], 'PullRequest'))
  jobs:
  - deployment: Publish
    displayName: Publish Fabric items to PROD
    environment: ${{ variables.projectSlug }}-prod
    pool:
      vmImage: $(agentImage)
    strategy:
      runOnce:
        deploy:
          steps:
          - download: current
            artifact: $(artifactName)

          - task: UsePythonVersion@0
            inputs:
              versionSpec: $(pythonVersion)

          - script: pip install "fabric-cicd==$(fabricCicdVersion)" "azure-identity>=1.15" "pyyaml>=6.0" "requests>=2.31"
            displayName: Install dependencies

          - script: >
              python "$(Pipeline.Workspace)/$(artifactName)/scripts/deploy.py"
              --workspace-id "$(prodWorkspaceId)"
              --environment PROD
              --repo-dir "$(Pipeline.Workspace)/$(artifactName)/$(fabricFolder)"
              --remove-deleted-items ${{ parameters.removeDeletedItems }}
              --debug ${{ parameters.debugLogging }}
            displayName: Deploy + smoke check
            env:
              AZURE_TENANT_ID: $(AZURE_TENANT_ID)
              AZURE_CLIENT_ID: $(AZURE_CLIENT_ID)
              AZURE_CLIENT_SECRET: $(AZURE_CLIENT_SECRET)

          # Tag the released commit as <slug>_<date>.<n>.
          # Needs "<Project> Build Service" to have Contribute + Create tag on the repo.
          # Safe to re-run: skips if the tag already exists.
          - checkout: self
            persistCredentials: true
            fetchDepth: 0

          - script: |
              set -e
              TAG="release/$(Build.BuildNumber)"
              if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
                echo "Tag $TAG already exists (stage re-run) - nothing to do."
                exit 0
              fi
              git config user.email "$(Build.RequestedForEmail)"
              git config user.name "$(Build.RequestedFor)"
              git tag -a "$TAG" "$(Build.SourceVersion)" -m "PROD release $(Build.BuildNumber)"
              git push origin "$TAG"
            workingDirectory: $(Build.SourcesDirectory)
            displayName: Tag the released commit
